# Kategoriregler för varunamn på ICA-kvitton.
#
# Matchning sker mot ett normaliserat varunamn (gemener, utan mängd- och
# förpackningsangivelser).
#
# BÄSTA träffen vinner, inte första. Svenska sammansättningar sätter
# huvudordet sist, så en träff i ordets slut väger tyngre än en i början:
# "korvbröd" är ett bröd, "citronläsk" är en läsk, "kycklingbuljong" är en
# buljong. Ett helt ord väger tyngst.
#
# Lika poäng bryts av ordningen i filen, så den ska gå från entydiga ord till
# svaga signaler. Varumärken och huvudord först; rena smakord -- citron,
# päron, hallon -- är den svagaste signal som finns och hör hemma sist.
# Därför ligger Dryck före Frukt & grönt: annars blir "LOKA CITRON" en frukt.
#
# En felkälla som inte går att regelfixa: foglingsformer. "Äpple" blir
# "äppel" i sammansättning, så regeln `äpple` missar "äppeljuice" helt.
# Sådana får fångas med egna regler eller för hand.
#
# En regel är antingen en delsträng eller ett reguljärt uttryck
# ({re: "..."}). En delsträng träffar när den ligger vid en ordgräns i någon
# ände, så att svenska sammansättningar fångas åt båda hållen: "mjölk"
# matchar "havremjölk" och "kyckling" matchar "kycklingfilé", medan "ros"
# inte matchar "kaffe mellanrost".
#
# Varje kategori hör till en grupp. Gruppen är vad diagrammen visar --
# ett stapeldiagram tål inte fyrtio serier -- och kategorin är detaljen du
# filtrerar och borrar ner till.
#
# Notera att det inte finns någon kategori "Fryst". Förvaringsform är inte
# varutyp: fryst lax är fisk, glass är glass, fryst pizza är pizza. En
# temperaturkategori korsar alla andra och gör placeringen godtycklig.
#
# Arbetsflöde: kör `icakort categorize --unknown`, eller använd
# bulkverktyget och Claude-förslagen i webbappen.

