[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "icakort"
version = "0.1.0"
description = "Kategorisera och för statistik över ICA-inköp från digitala kvitton i Kivra"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "qrcode>=7.4",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
icakort = "icakort.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/icakort"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
